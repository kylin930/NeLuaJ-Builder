name: Build NeLuaJ+ Builder APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Do not install the obsolete "tools" SDK package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37
        run: sdkmanager --install "platforms;android-37"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        id: build
        run: |
          ./gradlew --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :app:assembleDebug

      # Upload immediately after a successful build, before optional tests.
      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NeLuaJ-Builder-debug
          path: app/build/outputs/apk/debug/*.APK
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        if: success()
        run: |
          ./gradlew --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :app:testDebugUnitTest

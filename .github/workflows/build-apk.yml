name: Build NeLuaJ+ Builder APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # Android 17 / API 37 is currently published as android-37.0.
      - name: Install Android SDK 37
        run: |
          sdkmanager --install "platforms;android-37.0"
          # AGP's compileSdk=37 lookup expects the directory name android-37.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          sdkmanager --list_installed | grep -E "platforms;android-37(\.0)?"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        id: build
        run: |
          ./gradlew --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :app:assembleDebug

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NeLuaJ-Builder-debug
          path: app/build/outputs/apk/debug/*.APK
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        if: success()
        run: |
          ./gradlew --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :app:testDebugUnitTest
